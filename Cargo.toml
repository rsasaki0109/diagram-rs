[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/rsasaki0109/diagram-rs"

[workspace.dependencies]
diagram-core = { path = "crates/diagram-core" }
diagram-parser = { path = "crates/diagram-parser" }
diagram-layout = { path = "crates/diagram-layout" }
diagram-render = { path = "crates/diagram-render", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
