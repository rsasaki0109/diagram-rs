name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo check --locked -p diagram-cli --no-default-features
      - run: cargo build --release --locked -p diagram-cli
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Rust and bindings
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.105 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: scripts/build-wasm.sh
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:reference
      - run: npm run test:bundle
      - run: scripts/release-local.sh
      - uses: actions/upload-artifact@v4
        with:
          name: diagram-rs-linux-and-wasm
          path: dist/*
